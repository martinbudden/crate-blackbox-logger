[package]
name = "blackbox"
version = "0.1.0"
edition = "2024"
authors = ["Martin Budden"]
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/martinbudden/crate-blackbox"
description = "Blackbox flight data recorder."
keywords = ["blackbox", "no-std"]
categories = [
    "Embedded development",
    "Mathematics",
    "No standard library",
    "Robotics",
    "Science",
]

[features]
#default = ["barometer","servos","dshot_telemetry","rangefinder","magnetometer","eight_motors"]
default = ["barometer","dshot_telemetry","eight_motors"]
barometer=[]
eight_motors = []
servos = []
dshot_telemetry = []
rangefinder = []
magnetometer = []

[package.metadata.docs.rs]
rustdoc-args = ["--html-in-header", "katex-header.html"]

[build-dependencies]
rustc_version = "0.4.1"

[dependencies]
serde = { version = "1.0.228", default-features = false, features = ["derive"] }
postcard = { version = "1.1.3", features = ["embedded-io"] }
receivers = {  path = "../receivers" }

[dev-dependencies]
approx = { version = "0.5.1", default-features = false }

# see https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.dev]
opt-level = 0
debug = "line-tables-only"
# split-debuginfo = '...'  # Platform-specific.
strip = "none"
debug-assertions = true
overflow-checks = true
lto = false
panic = 'unwind'
incremental = true
codegen-units = 256
rpath = false

[profile.dev.package."*"]
debug = false

[profile.debugging]
inherits = "dev"
debug = true

[profile.release]
opt-level = 3
debug = false
# split-debuginfo = '...'  # Platform-specific.
strip = "none"
debug-assertions = false
overflow-checks = false
lto = false
panic = 'abort'
incremental = false
codegen-units = 16
rpath = false

[profile.release-lto]
inherits = "release"
lto = true
